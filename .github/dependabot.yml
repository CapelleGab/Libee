version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      slint:
        patterns: ["slint*", "i-slint*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
